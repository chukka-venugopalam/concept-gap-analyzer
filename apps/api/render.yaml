services:
  - type: web
    name: cip-api
    env: python
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: >
      uvicorn main:app
      --host 0.0.0.0
      --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://cip.vercel.app
      - key: ENVIRONMENT
        value: production
